[project]
name = "rift-lab-backend"
version = "0.1.0"
description = "League of Legends analytics & coaching platform - API, ingestion, analytics and ML services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "tenacity>=8.5.0",
    "structlog>=24.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "joblib>=1.4.0",
    "typer>=0.12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-redis",
    "respx>=0.21.0",
]
# Reserved for future model upgrades; the ml service layer is written against
# a `GradientModel` protocol so these become drop-in replacements.
boost = [
    "xgboost>=2.1.0",
]
torch = [
    "torch>=2.4.0",
]

[project.scripts]
riftlab = "app.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
# The end-to-end ML suite ingests a rank-spanning corpus and trains a real
# model. It is the most valuable suite and the slowest, so it is opt-in locally
# (`pytest -m slow`) and always run in CI.
addopts = "-m 'not slow'"
markers = [
    "slow: ingests a corpus and trains models; minutes rather than seconds",
]
