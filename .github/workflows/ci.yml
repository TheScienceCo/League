name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aoe2
          POSTGRES_PASSWORD: aoe2
          POSTGRES_DB: aoe2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aoe2"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type check
        run: mypy app

      # Runs on SQLite: fast, and proves the suite needs no containers.
      - name: Tests (fast)
        run: pytest -q --cov=app --cov-report=term-missing

      # The end-to-end ML suite ingests a corpus and trains real models. It is
      # the check that the methodology recovers structure we know is present.
      - name: Tests (end-to-end ML)
        run: pytest -q -m slow

      # Re-run the suite against the production dialect so Postgres-only
      # behaviour cannot regress unnoticed.
      - name: Tests against Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aoe2:aoe2@localhost:5432/aoe2_test
        run: pytest -q

      # Migrations must both apply and agree with the models, so schema drift
      # fails CI rather than surfacing as a runtime error.
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+psycopg://aoe2:aoe2@localhost:5432/aoe2_migrations
          PGPASSWORD: aoe2
        run: |
          psql -h localhost -U aoe2 -d postgres -c "CREATE DATABASE aoe2_migrations;"
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
